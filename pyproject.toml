[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "curbwatch"
version = "0.1.0"
description = "Self-hosted parking ticket monitoring and historical street activity"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/DEADSEC-SECURITY/curbwatch"
Issues = "https://github.com/DEADSEC-SECURITY/curbwatch/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
