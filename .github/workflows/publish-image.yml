name: Publish Docker image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        required: true
        default: latest
        type: string
permissions:
  contents: read
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose image tags
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            tag="${RELEASE_TAG#v}"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid Docker image tag.' >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            echo "elgon2003/curbwatch:$tag"
            if [ "$EVENT_NAME" = release ] && [ "$PRERELEASE" = false ] && [ "$tag" != latest ]; then
              echo 'elgon2003/curbwatch:latest'
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: elgon2003
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true
