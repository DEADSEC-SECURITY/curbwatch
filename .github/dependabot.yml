version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    groups:
      container-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: terraform
    directory: /deploy/terraform
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    groups:
      terraform-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
